[project]
name = "vk-members"
version = "0.1.0"
description = "Выгрузка участников сообщества ВКонтакте по первой букве фамилии"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
]

[project.scripts]
vk-members = "vk_members.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
